# Hyprland config — ported from ~/.config/i3/config
# Reference: https://wiki.hyprland.org/Configuring/
# Hyprland reloads this file automatically on save.

$mod = SUPER
$terminal = ghostty
$launcher = wofi --show drun

#----------------------------------------------------------------------------------------------------
# Monitors — 4 across, left to right (was ~/.screenlayout/quad.sh)
# X names HDMI-0, DP-0, DP-2, DP-4 are HDMI-A-1, DP-1, DP-2, DP-3 on Wayland.
# Check with `hyprctl monitors`. All four support 100Hz: change @60 to @100 to use it.
#----------------------------------------------------------------------------------------------------
monitor = HDMI-A-1, 2560x1440@60, 0x0,    1
monitor = DP-1,     2560x1440@60, 2560x0, 1
monitor = DP-2,     2560x1440@60, 5120x0, 1
monitor = DP-3,     2560x1440@60, 7680x0, 1
monitor = , preferred, auto, 1

#----------------------------------------------------------------------------------------------------
# NVIDIA
#----------------------------------------------------------------------------------------------------
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

cursor {
    no_hardware_cursors = true
}

#----------------------------------------------------------------------------------------------------
# Autostart
#----------------------------------------------------------------------------------------------------
exec-once = dex --autostart --environment Hyprland
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = mako
exec-once = waybar

# wallpaper
exec-once = swaybg -m fill -i ~/pink_galaxy.jpeg

#----------------------------------------------------------------------------------------------------
# Look & feel — matches the i3 setup: no borders, no gaps
#----------------------------------------------------------------------------------------------------
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
    layout = dwindle
}

decoration {
    rounding = 0
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

#----------------------------------------------------------------------------------------------------
# Input
#----------------------------------------------------------------------------------------------------
input {
    kb_layout = us
    kb_options = caps:super    # caps lock acts as super (was setxkbmap)
    follow_mouse = 1
}

#----------------------------------------------------------------------------------------------------
# Keybinds
#----------------------------------------------------------------------------------------------------

# volume (bindel = repeat while held, works on lock screen)
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindl  = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# drag floating windows with $mod+left mouse, resize with $mod+right mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Q, killactive
bind = $mod, D, exec, $launcher

# change focus (on a tabbed/monocle workspace, left/right cycle its windows)
$tabbed = ~/.config/hypr/scripts/tabbed.sh
bind = $mod, H, exec, $tabbed focus l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, exec, $tabbed focus r
bind = $mod, Left,  exec, $tabbed focus l
bind = $mod, Down,  movefocus, d
bind = $mod, Up,    movefocus, u
bind = $mod, Right, exec, $tabbed focus r

# move focused window (same shifted j/k/l/; layout as the i3 config)
bind = $mod SHIFT, J,         movewindow, l
bind = $mod SHIFT, K,         movewindow, d
bind = $mod SHIFT, L,         movewindow, u
bind = $mod SHIFT, semicolon, movewindow, r
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Down,  movewindow, d
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# split h / split v: choose where the NEXT window opens
bind = $mod, B, layoutmsg, preselect r
bind = $mod, V, layoutmsg, preselect d
# layout toggle split (from tabbed, goes back to split like i3)
bind = $mod, E, exec, $tabbed split

bind = $mod, F, fullscreen, 0

# tabbed/stacked -> monocle layout for this workspace: one window full-size,
# $mod+h/l cycle the rest. Press again (or $mod+e) to go back to tiling.
bind = $mod, W, exec, $tabbed toggle
bind = $mod, S, exec, $tabbed toggle

bind = $mod SHIFT, space, togglefloating
# focus mode_toggle (tiling <-> floating) has no direct equivalent; cycle windows instead
bind = $mod, space, cyclenext

# switch to workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# move focused window to workspace (without following it, like i3)
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# reload / "restart" (both just reload; saving this file also reloads it)
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload

# exit Hyprland (logs you out)
bind = $mod SHIFT, E, exec, swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit Hyprland? This will end your Wayland session.' -B 'Yes, exit Hyprland' 'hyprctl dispatch exit'

# lock screen
bind = $mod SHIFT, X, exec, swaylock -c 000000

# region screenshot: saved to ~/Pictures and copied to the clipboard
bind = $mod SHIFT, S, exec, sh -c 'f=~/Pictures/screenshot_$(date +%d-%b-%Y_%H-%M-%S).png; grim -g "$(slurp)" "$f" && wl-copy < "$f"'

# resizing (like tmux); binde = repeats while held
binde = $mod CTRL, Right, resizeactive, 100 0
binde = $mod CTRL, Left,  resizeactive, -100 0
binde = $mod CTRL, Up,    resizeactive, 0 -100
binde = $mod CTRL, Down,  resizeactive, 0 100

# resize mode ($mod+r, then j/k/l/; or arrows; Enter/Escape/$mod+r to leave)
bind = $mod, R, submap, resize
submap = resize
binde = , J,         resizeactive, -100 0
binde = , K,         resizeactive, 0 100
binde = , L,         resizeactive, 0 -100
binde = , semicolon, resizeactive, 100 0
binde = , Left,  resizeactive, -100 0
binde = , Down,  resizeactive, 0 100
binde = , Up,    resizeactive, 0 -100
binde = , Right, resizeactive, 100 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, R,  submap, reset
submap = reset
